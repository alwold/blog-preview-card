<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    :root {
        --yellow: #f4d04e;
        --gray-950: #111111;
        --gray-500: #6b6b6b;
        --spacing-300: 24px;
        --spacing-150: 12px;
        --spacing-100: 8px;
        --spacing-50: 4px;
    }
    @font-face {
        font-family: "figtree";
        src: url("assets/fonts/Figtree-VariableFont_wght.ttf");
    }
    body {
        background: var(--yellow);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: "figtree";
    }
    .card {
        background: white;
        width: 336px;
        padding: 24px;
        border-width: 1px;
        border-color: black;
        border-radius: 20px;
        border-style: solid;
        box-shadow: black 8px 8px;
    }
    img.illustration {
        border-radius: 10px;
    }
    h1 {
        padding: 4px 12px 4px 12px;
        background: var(--yellow);
        border-radius: 4px;
        width: max-content;
        font-size: 14px;
        font-weight: bold;
        line-height: 1.5;
        color: var(--gray-950);
    }
    p.published {
        font-size: 14px;
        color: var(--gray-950);
    }

    h2 {
        font-size: 24px;
        font-weight: bold;
        line-height: 1.5;
        color: var(--gray-950);
    }

    p.body {
        color: var(--gray-500);
        font-size: 16px;
        line-height: 1.5;
    }

    author {
        font-size: 14px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    author img {
        height: 32px;
        width: 32px;
    }
  </style>
</head>
<body>
  <div class="card">
  <img class="illustration" src="assets/images/illustration-article.svg">

  <h1>
    Learning
  </h1>

  <p class="published">
    Published 21 Dec 2023
  </p>

  <h2>
    HTML & CSS foundations
  </h2>

  <p class="body">
    These languages are the backbone of every website, defining structure, content, and presentation.
  </p>

  <author>
    <img src="assets/images/image-avatar.webp">
    Greg Hooper
  </author>
  </div>
</body>
</html>
